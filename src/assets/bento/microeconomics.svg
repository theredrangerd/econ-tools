<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" preserveAspectRatio="xMidYMid meet">
  <g fill="none" stroke="#22303f" stroke-linecap="round">
    <!-- axes -->
    <line x1="40" y1="15" x2="40" y2="190" stroke-width="2.5" stroke-opacity="0.35" />
    <line x1="40" y1="190" x2="380" y2="190" stroke-width="2.5" stroke-opacity="0.35" />
    <!-- demand curve -->
    <line x1="55" y1="30" x2="365" y2="180" stroke-width="5" stroke-opacity="0.62" />
    <!-- supply curve -->
    <line x1="55" y1="180" x2="365" y2="30" stroke-width="5" stroke-opacity="0.62" />
    <!-- dashed guides to equilibrium -->
    <line x1="210" y1="105" x2="210" y2="190" stroke-width="2.5" stroke-dasharray="7,7" stroke-opacity="0.35" />
    <line x1="40" y1="105" x2="210" y2="105" stroke-width="2.5" stroke-dasharray="7,7" stroke-opacity="0.35" />
  </g>
  <circle cx="210" cy="105" r="8" fill="#22303f" fill-opacity="0.7" />
</svg>
